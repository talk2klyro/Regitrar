<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MicroSkills Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>MicroSkills Dashboard</h1>
    <div>
      <button class="active">Overview</button>
      <button>Analytics</button>
      <button>Settings</button>
    </div>
  </header>

  <aside>
    <nav>
      <ul>
        <li><button>Skills</button></li>
        <li><button>Timeline</button></li>
        <li><button>Reflections</button></li>
        <li><button>Achievements</button></li>
      </ul>
    </nav>
  </aside>

  <main>
    <section id="input-section">
      <h2>Add New Skill</h2>
      <input type="text" placeholder="Skill name" />
      <select>
        <option value="">Category</option>
        <option value="Creative">Creative</option>
        <option value="Technical">Technical</option>
        <option value="Analytical">Analytical</option>
      </select>
      <input type="number" placeholder="Progress %" />
      <button>Add Skill</button>
    </section>

    <section id="skills-grid">
      <!-- Skill cards will be injected here -->
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
