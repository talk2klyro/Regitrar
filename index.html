<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Progress Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Growth Dashboard</h1>
    <div class="time-toggle">
      <button data-range="daily">Daily</button>
      <button data-range="weekly">Weekly</button>
      <button data-range="monthly">Monthly</button>
    </div>
  </header>

  <aside>
    <ul id="skills-list"></ul>
  </aside>

  <main>
    <section id="charts"></section>
    <section id="summary-cards"></section>
    <section id="burnout-gauge"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
